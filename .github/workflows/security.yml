name: Security

on:
    push:
        branches: [main, develop]
    pull_request:
    schedule:
        - cron: "0 2 * * 1"

concurrency:
    group: security-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    osv-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.24"
                  cache: false
            - name: 安装 osv-scanner CLI
              run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
            - name: OSV 依赖漏洞扫描（pnpm + Cargo）
              run: |
                  "$(go env GOPATH)/bin/osv-scanner" scan --format json --lockfile pnpm-lock.yaml --lockfile server/Cargo.lock > osv.json || true
                  node -e '
                    const fs = require("fs");
                    const o = JSON.parse(fs.readFileSync("osv.json", "utf8"));
                    const total = (o.results || []).reduce((n, r) => n + (r.packages || []).reduce((m, p) => m + (p.vulnerabilities || []).length, 0), 0);
                    const high = [];
                    for (const r of o.results || []) for (const p of r.packages || []) for (const v of p.vulnerabilities || []) {
                      const score = Math.max(0, ...(v.severity || []).map((s) => s.score ?? 0));
                      if (score >= 7) high.push(p.package.name + "@" + p.package.version + " cvss=" + score + " " + (v.id || (v.aliases || [])[0] || ""));
                    }
                    if (high.length) { console.error("BLOCKING HIGH/CRITICAL:\n" + high.join("\n")); process.exit(1); }
                    console.log("osv: total advisories=" + total + ", CVSS>=7 blocking=0（低危/未知通告不阻断，明细见日志）");
                  '

    dependency-audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: pnpm audit（>= high 视为失败）
              run: pnpm audit --prod --audit-level high

    secret-scan:
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Gitleaks 密钥扫描
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    codeql:
        runs-on: ubuntu-latest
        permissions:
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: [javascript-typescript, rust]
        steps:
            - uses: actions/checkout@v4
            - name: 检查 YOLO 模型资源（Rust 编译 gate）
              id: check-model
              shell: bash
              run: |
                  if [ "${{ matrix.language }}" = "rust" ] && [ ! -f libs/large.onnx ]; then
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                    echo "::notice::libs/large.onnx 缺失，Rust CodeQL 跳过（补齐模型后自动启用）"
                  else
                    echo "skip=false" >> "$GITHUB_OUTPUT"
                  fi
            - name: CodeQL init
              if: steps.check-model.outputs.skip != 'true'
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
            - name: CodeQL autobuild
              if: steps.check-model.outputs.skip != 'true'
              uses: github/codeql-action/autobuild@v4
            - name: CodeQL analyze
              if: steps.check-model.outputs.skip != 'true'
              uses: github/codeql-action/analyze@v4
